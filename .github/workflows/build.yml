name: build

# Each push builds a single linux wheel (cp313), which also runs the C++ tests and builds the docs (as a check, they are published by Cloudflare Pages, see misc/docs/build.sh).
# The full build (all platforms and python versions) runs on release tags (v*), and manually via "Run workflow".
# Each built wheel is tested with the python tests (tests/) and test-wheel.py.
on:
  push:
  workflow_dispatch:

# cancel the previous run of the same branch (but never release runs)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # built manually, bump the tag when misc/docker/libqif-manylinux changes:
  #   docker build --pull -t ghcr.io/chatziko/libqif/manylinux:vN misc/docker/libqif-manylinux
  #   docker push ghcr.io/chatziko/libqif/manylinux:vN
  MANYLINUX_IMAGE: ghcr.io/chatziko/libqif/manylinux:v15

jobs:
  # On release tags, check that the latest version in CHANGELOG.md matches the tag (before spending time on wheels)
  changelog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-test')

    - name: Check CHANGELOG.md
      if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-test')
      run: bash .github/workflows/changelog-section.sh "${GITHUB_REF_NAME#v}"


  # Build wheels on all platforms ########################################################
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [changelog]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
              && '["ubuntu-latest", "macos-15-intel", "macos-15", "windows-latest"]'
              || '["ubuntu-latest"]') }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0    # needed for tags


    - uses: actions/setup-python@v5
      name: Install Python
      with:
        python-version: '3.13'

    # cmake >= 4.2 is needed for the runner's Visual Studio (linux gets cmake from the docker image)
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.2.x'

    - name: Build wheels
      shell: bash     # on windows the default is pwsh, which does not stop when cibuildwheel fails
      env:
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: python {project}/.github/workflows/test-wheel.py && python -m pytest {project}/tests -p no:cacheprovider
        CIBW_BUILD: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
                      && 'cp3{11,12,13,14,15}-{manylinux_x86_64,macosx_x86_64,macosx_arm64,win_amd64}'
                      || 'cp313-manylinux_x86_64' }}
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ env.MANYLINUX_IMAGE }}
        CIBW_BEFORE_ALL_LINUX: bash .github/workflows/prepare-build-linux.sh
        CIBW_BEFORE_ALL_MACOS: bash .github/workflows/prepare-build-macos.sh
        CIBW_BEFORE_ALL_WINDOWS: bash .github/workflows/prepare-build-windows.sh

        CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair -L /.libs -w {dest_dir} {wheel}  # -L /.libs puts the libs under "qif/.libs"
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: delocate-wheel -v -w {dest_dir} {wheel}            # --require-archs x86_64 (this throws error for some reason)
        # delvewheel: use mp++.dll already in the wheel (--ignore-existing) and vendor its dependencies (--analyze-existing).
        # dlls: msvcp140 from System32 (the newest), ortools in usr/local/bin, openblas in usr/local/lib, gsl/gmp from vcpkg
        CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
          pip install delvewheel &&
          delvewheel repair --ignore-existing --analyze-existing -w {dest_dir} {wheel}
          --add-path "C:/Windows/System32;C:/Program Files/Git/usr/local/bin;C:/Program Files/Git/usr/local/lib;C:/vcpkg/installed/x64-windows/bin"

        # the brew libraries (gsl, gmp) are built for the runner's macos version
        CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=15.0 CMAKE_PREFIX_PATH=/opt/ortools"

        # Windows CMAKE configuration
        # CMAKE_TOOLCHAIN_FILE  find the libraries installed via vcpkg
        # CMAKE_PREFIX_PATH     find the libraries installed in git bash's /usr/local
        # BUILD_QIF             force to re-build qif_cpp when building qif_python (the default is to use the system's qif)
        CIBW_ENVIRONMENT_WINDOWS: "CMAKE_TOOLCHAIN_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake' CMAKE_PREFIX_PATH='C:/Program Files/Git/usr/local' BUILD_QIF=1"

      run: |
        python -m pip install cibuildwheel==4.3.1
        python -m cibuildwheel --output-dir wheelhouse lib_python
        mkdir wheelhouse/dist && mv wheelhouse/*.whl wheelhouse/dist/
        python .github/workflows/check-wheel-record.py "wheelhouse/dist/*.whl"     # PyPI requires wheel contents to match RECORD

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/


  # Upload wheels to PyPI ##########################################################
  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags/v')
    permissions:
      contents: write     # for creating the GitHub release
    steps:
      - uses: actions/checkout@v5     # for CHANGELOG.md (before downloading the wheels, checkout cleans the dir)

      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ !contains(github.event.ref, '-test') }}
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: contains(github.event.ref, '-test')
        with:
          user: __token__
          password: ${{ secrets.test_pypi_password }}
          repository-url: https://test.pypi.org/legacy/

      # GitHub release (not for test tags), with the CHANGELOG.md section of the version as notes, and the wheels
      - name: GitHub release
        if: ${{ !contains(github.event.ref, '-test') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/workflows/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.whl --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
