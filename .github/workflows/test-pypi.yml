# Test the qif wheels published on PyPI: install on all platforms and python versions, run test-wheel.py and the python tests
# (tests/ of the installed version's tag, so that they match the published code; older versions have no tests/)
name: test-pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'qif version to test (empty for the latest)'
        required: false
        default: ''

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/workflows/test-wheel.py
        sparse-checkout-cone-mode: false

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true

    - name: Install qif
      shell: bash
      run: python -m pip install pytest --only-binary qif "qif${{ inputs.version && format('=={0}', inputs.version) || '' }}"

    - name: Get installed version
      id: qif
      shell: bash
      run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("qif"))')" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v4
      with:
        ref: v${{ steps.qif.outputs.version }}
        path: release
        sparse-checkout: tests
        sparse-checkout-cone-mode: false

    - name: Test
      shell: bash
      run: |
        python .github/workflows/test-wheel.py
        if [ -d release/tests ]; then python -m pytest release/tests -p no:cacheprovider; else echo "no tests/ in v${{ steps.qif.outputs.version }}"; fi
