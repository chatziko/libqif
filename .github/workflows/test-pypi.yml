# Test the qif wheels published on PyPI: install on all platforms and python versions, run test-wheel.py
name: test-pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'qif version to test (empty for the latest)'
        required: false
        default: ''

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/workflows/test-wheel.py
        sparse-checkout-cone-mode: false

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true

    - name: Install qif
      shell: bash
      run: python -m pip install --only-binary qif "qif${{ inputs.version && format('=={0}', inputs.version) || '' }}"

    - name: Test
      run: python .github/workflows/test-wheel.py
